services:
  - type: web
    name: ai-study-companion
    env: python
    buildCommand: "./build.sh"
    startCommand: "gunicorn lumen_project.wsgi:application"
    autoDeploy: true
    envVars:
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: "ai-study-companion.onrender.com"
